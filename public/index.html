<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECE8DF" />
    <meta name="description" content="Tessel — a calm PDF viewer. No ads, no account; files stay on your device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #ECE8DF; }
      @media (prefers-color-scheme: dark) { html, body { background: #18191C; } }
      /* App fills the *visible* viewport (dvh tracks mobile browser bars) and the document itself never scrolls:
         all scrolling happens inside the app, so the URL bar can't push content off-screen. */
      body {
        position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      #root { display: flex; flex: 1; height: 100%; height: 100dvh; }
      ::selection { background: rgba(47, 79, 134, 0.22); }
      /* Controls are pressed, not read: a long press (holding "Original" in the scanner, opening a row's
         actions) must not start a text selection or the system's callout. Document text stays selectable. */
      :is([role=button], [role=tab], [role=switch], [role=radio], [role=checkbox], [role=menuitem], button),
      :is([role=button], [role=tab], [role=switch], [role=radio], [role=checkbox], [role=menuitem], button) * {
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      :focus-visible { outline: 2px solid #2F4F86; outline-offset: 2px; border-radius: 6px; }
      /* Text fields show the caret and their own box: no ring around the text itself. */
      input:focus-visible, textarea:focus-visible { outline: none; }
    </style>
    <script>
      // Android app, opened with a file: the PDF engine starts and the file is read while the app's code
      // loads (src/lib/shell.ts and src/engine take them over).
      (function () {
        var shell = window.TesselShell;
        if (!shell) return;
        // Where the app is served (set by scripts/postexport.mjs; the Android app serves it at the root).
        var base = '';
        try {
          var list = JSON.parse(shell.pending());
          if (!list.length) return;
          // A bare first screen: no other screen is built before the document's.
          history.replaceState(null, '', base + '/opening');
          window.__tesselLaunch = {
            list: list,
            worker: new Worker(base + '/engine/pdfium-worker.js', { type: 'module' }),
            files: Promise.all(list.map(function (f) {
              return fetch(f.url).then(function (r) { return r.blob(); }).then(function (b) { return new File([b], f.name, { type: f.type || b.type }); });
            })),
          };
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Tessel needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      // The browser's Back while the app holds it (unsaved edits, src/lib/backGuard.ts): this listener comes
      // before the router's, so the router never sees the step back the app undoes.
      addEventListener('popstate', function (e) {
        var hold = window.__tesselPopHold;
        if (hold && hold()) e.stopImmediatePropagation();
      });
    </script>
    <script>
      // Capture the install prompt before the app mounts; it fires once, early.
      addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__installPrompt = e;
        dispatchEvent(new Event('tessel:installable'));
      });
      addEventListener('appinstalled', () => {
        window.__installPrompt = null;
        dispatchEvent(new Event('tessel:installable'));
      });
      // Not in dev, and not in the Android app (its files are in the APK already).
      if ('serviceWorker' in navigator && location.port !== '8081' && !/TesselShell/.test(navigator.userAgent)) {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
