<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECE8DF" />
    <meta name="description" content="Quire — a quiet place to read. Local-first PDF reader." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #ECE8DF; }
      @media (prefers-color-scheme: dark) { html, body { background: #18191C; } }
      /* App fills the *visible* viewport (dvh tracks mobile browser bars) and the document itself never scrolls:
         all scrolling happens inside the app, so the URL bar can't push content off-screen. */
      body {
        position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      #root { display: flex; flex: 1; height: 100%; height: 100dvh; }
      ::selection { background: rgba(47, 79, 134, 0.22); }
      :focus-visible { outline: 2px solid #2F4F86; outline-offset: 2px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <noscript>Quire needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      // Capture the install prompt before the app mounts; it fires once, early.
      addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__installPrompt = e;
        dispatchEvent(new Event('quire:installable'));
      });
      addEventListener('appinstalled', () => {
        window.__installPrompt = null;
        dispatchEvent(new Event('quire:installable'));
      });
      if ('serviceWorker' in navigator && location.port !== '8081') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
