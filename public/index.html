<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECE8DF" />
    <meta name="description" content="Quire — a quiet place to read. Local-first PDF reader." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #ECE8DF; }
      @media (prefers-color-scheme: dark) { html, body { background: #18191C; } }
      body { overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
      ::selection { background: rgba(47, 79, 134, 0.22); }
      :focus-visible { outline: 2px solid #2F4F86; outline-offset: 2px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <noscript>Quire needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.port !== '8081') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
