name: Scan quality

# Scanner quality (e2e/scan): synthetic photos through the real workers and PDF export. ~45 min, so manual only:
# Actions → Scan quality → Run workflow (or run `npm run test:scan` locally).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:scan -- --no-clean-ocr --max-cer 0.07
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-report
          path: |
            e2e/out/scan/report.md
            e2e/out/scan/results.json
