name: Scan quality

# Scanner quality (e2e/scan): synthetic photos through the real workers and PDF export. ~45 min, so manual only:
# Actions → Scan quality → Run workflow (or run `npm run test:scan` locally).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:scan -- --no-clean-ocr --max-cer 0.07
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-report
          path: |
            e2e/out/scan/report.md
            e2e/out/scan/results.json
