name: Desktop

# Tessel for macOS (and, from the same shell, Windows and Linux): the web app in an Electron window
# (shell/desktop). Every push to main starts it for real on Linux and builds the macOS app; a new version in
# package.json adds the macOS app to that version's GitHub release once the Android workflow has created it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop-web
      - run: npm ci
        working-directory: shell/desktop
      # Electron fetches its binary on first use: here, not inside the test's time.
      - name: Fetch Electron
        working-directory: shell/desktop
        run: node node_modules/electron/install.js
      - name: Desktop smoke test
        working-directory: shell/desktop
        run: xvfb-run -a npm run smoke

  mac:
    needs: smoke
    runs-on: macos-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          # A version whose tag doesn't exist yet is being released by this push (the Android workflow tags it);
          # a released version still without the macOS app gets it from the next run on main, built from the
          # released commit (the one its checks passed), not from this one.
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$PKG")" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then echo "release=true" >> "$GITHUB_OUTPUT"; fi
          elif [ "$GITHUB_REF" = refs/heads/main ] && ! gh release view "v$PKG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q -- '-mac\.dmg$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            git fetch -q --depth=1 origin "refs/tags/v$PKG:refs/tags/v$PKG"
            git checkout -q "v$PKG"
          fi
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build:desktop-web
      - run: npm ci
        working-directory: shell/desktop
      - name: Build the macOS app
        working-directory: shell/desktop
        # Not signed (no Apple Developer ID): macOS asks once, on the first start (Open from the context menu).
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never -c.extraMetadata.version=${{ steps.version.outputs.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: tessel-mac
          path: |
            shell/desktop/dist/*.dmg
            shell/desktop/dist/*.zip

  release:
    needs: mac
    if: needs.mac.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: tessel-mac
          path: out
      # The Android workflow publishes the release (after the Web checks): the macOS app joins it there.
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.mac.outputs.version }}
        run: |
          for _ in $(seq 1 90); do
            # Retried too: the release can be seen while Android is still publishing it ("release not found").
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            sleep 20
          done
          # Not published (no signing secrets, the Web checks failed): the app stays in this run's artifacts.
          echo "::warning::Release $TAG didn't appear within 30 minutes; the macOS app is in this run's artifacts"
