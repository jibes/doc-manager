name: Android

# The Android app: the web app bundled in a WebView shell (shell/android). Every push to main builds and
# smoke-tests an APK on an emulator; a new version in package.json on main, a version tag (v1.2.3) or a
# manual run with a version publishes a signed release on GitHub, which Obtainium (or any browser) installs and updates from.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a signed release with this version (e.g. 1.2.3; creates tag v1.2.3)
        required: false
        default: ''

permissions:
  contents: read

# A newer push replaces a waiting run; on main one that is running finishes (it may be publishing a release).
concurrency:
  group: android-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      release: ${{ steps.version.outputs.release }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle the web app
        run: npm run build:android-web

      - id: version
        name: Version
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then REQUESTED="${GITHUB_REF#refs/tags/v}"; else REQUESTED="$INPUT_RELEASE"; fi
          # A new version in package.json on main publishes itself (once: its tag then exists).
          if [ -z "$REQUESTED" ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            PKG="$(node -p "require('./package.json').version")"
            if [ -z "$(git ls-remote --tags origin "refs/tags/v$PKG")" ]; then REQUESTED="$PKG"; fi
          fi
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::Version must look like 1.2.3 (no leading zeros)"; exit 1; fi
            NAME="$REQUESTED"
            echo "release=true" >> "$GITHUB_OUTPUT"
            IFS=. read -r MA MI PA <<< "${NAME%%-*}"
            CODE=$(( MA * 1000000 + MI * 1000 + PA ))
          else
            NAME="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
            CODE=1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # Updates install only over an APK signed with the same key: releases must use the secrets.
      - id: key
        name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tessel.keystore"
            echo "TESSEL_KEYSTORE_FILE=$RUNNER_TEMP/tessel.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK is signed with a throwaway debug key (testing only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.version.outputs.release }}" = true ]; then echo "::error::Releases need the signing secrets."; exit 1; fi
          fi

      - name: Build APK
        working-directory: shell/android
        env:
          TESSEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TESSEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TESSEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -Ptessel.versionName="${{ steps.version.outputs.name }}" -Ptessel.versionCode="${{ steps.version.outputs.code }}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/tessel-${{ steps.version.outputs.name }}.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v7
        with:
          name: tessel-apk
          path: out/*.apk

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: tessel-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator action downloads these once and fails on a broken download; fetch them with retries first.
      - name: Install emulator and system image
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$sdk" --install emulator 'system-images;android-34;google_apis;x86_64' > /dev/null || true
            # A broken archive is only a warning, so check the image is really there.
            [ -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/system.img" ] && break
            echo "Download failed (attempt $i), retrying"; sleep 15
          done
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The scanner needs a camera: the emulated one (a generated picture, no GPU needed).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: ./scripts/android-smoke.sh "$(ls out/*.apk | head -1)" android-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke
          path: android-smoke

  release:
    if: needs.apk.outputs.release == 'true' && needs.apk.outputs.signed == 'true'
    needs: [apk, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Only a commit the Web workflow passed (types, lint, unit and end-to-end tests) is published.
      - name: Wait for the Web checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            STATE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow web.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')"
            case "$STATE" in
              "completed success") echo "Web checks passed"; exit 0 ;;
              completed*) echo "::error::The Web checks didn't pass on this commit ($STATE)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::The Web checks didn't finish within 30 minutes"; exit 1
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v7
        with:
          name: tessel-apk
          path: out
      # What's new in this version (docs/releases/<version>.md, when there is one) under the install note.
      - name: Release notes
        env:
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          {
            echo "**Tessel $VERSION for Android.** Download the APK below and open it to install"
            echo "(allow installs from your browser or file manager when asked). To get updates automatically,"
            echo "add this repository in [Obtainium](https://github.com/ImranR98/Obtainium)."
            if [ -f "docs/releases/$VERSION.md" ]; then echo; echo "## What's new"; echo; sed '1{/^# /d}' "docs/releases/$VERSION.md"; fi
          } > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
          # 1.2.3-beta.1 and the like: offered to those who want pre-releases only.
          prerelease: ${{ contains(needs.apk.outputs.version, '-') }}
