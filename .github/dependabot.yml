# Weekly updates (STANDARD.md §9). Expo's packages move together with the SDK (`npx expo upgrade`, then
# `npx expo install --fix`), never one by one: Dependabot leaves them alone. Major versions are done on purpose,
# one at a time (they change APIs, configs or the build), not by Dependabot; at most 2 open PRs per ecosystem,
# so its PRs never queue ahead of main's CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /shell/desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /shell/android
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Needs compileSdk 37 and AGP 9.1: comes with the AGP 9 upgrade, not before.
      - dependency-name: 'androidx.core:core-ktx'
        versions: ['>=1.18.0']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
